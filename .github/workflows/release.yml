name: Release

# Push a tag like v0.3.1 to create a GitHub release from CHANGELOG.md and
# stage the version on npm. Publishing uses npm Trusted Publishing (OIDC): npm
# trusts this workflow in this repository, so no npm token exists anywhere,
# and every version gets a signed provenance statement automatically.
#
# The trusted publisher may only *stage* a version. A maintainer then makes it
# public with their security key (npmjs.com, or `npm stage approve <id>`), so a
# compromised workflow cannot ship a release on its own.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 ships npm 11, which supports trusted publishing.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0 == v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          test -s notes.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "rtlint $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
      - name: Stage on npm (trusted publishing)
        run: |
          spec="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "::notice::$spec is already on npm."
            exit 0
          fi
          # Node 24 ships npm 11; staged publishing needs npm 12.
          npx --yes npm@12.2.1 stage publish --access public
          echo "::notice::$spec is staged. Approve it on npmjs.com with a security key to publish it."

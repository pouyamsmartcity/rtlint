name: Playground

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # GitHub Pages needs a public repository on the free plan.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          site=https://pouyamsmartcity.github.io/rtlint
          mkdir -p _site/playground
          cp -r src _site/src
          cp playground/index.html _site/playground/index.html
          cp docs/og.png llms.txt _site/
          printf '<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><title>rtlint by Pouyam</title><link rel="canonical" href="%s/playground/"><meta http-equiv="refresh" content="0; url=playground/"><a href="playground/">rtlint playground</a></html>' "$site" > _site/index.html
          printf 'User-agent: *\nAllow: /\nSitemap: %s/sitemap.xml\n' "$site" > _site/robots.txt
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>%s/playground/</loc><changefreq>weekly</changefreq></url></urlset>\n' "$site" > _site/sitemap.xml
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

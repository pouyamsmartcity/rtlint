name: False positive or wrong fix
description: rtlint reported or changed something that was correct
labels: [false-positive]
body:
  - type: input
    id: rule
    attributes:
      label: Rule
      placeholder: class/physical-utility
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: File name (the extension matters)
      placeholder: src/components/Card.svelte
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Snippet
      description: The smallest input that shows the problem.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and why is the original correct?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: rtlint version
      placeholder: 0.2.0

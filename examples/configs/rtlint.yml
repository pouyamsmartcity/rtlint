# .github/workflows/rtlint.yml
name: RTL check
on: [pull_request]
permissions:
  contents: read
  security-events: write
jobs:
  rtlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pouyamsmartcity/rtlint@v0
        with:
          paths: src messages
          changed-only: true
          lang: fa
          sarif: rtlint.sarif
          args: --max-warnings 0
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: rtlint.sarif
